<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Coming Soon</title>
<meta name="description" content="Something new is on the way." />
<link rel="icon" href="logo.png" type="image/png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500&display=swap"
  rel="stylesheet"
/>
<style>
  :root {
    --bg: #000000;
    --fg: #ffffff;
    --font: "Google Sans", "Product Sans", Roboto, "Helvetica Neue",
      Helvetica, Arial, sans-serif;
  }

  *,
  *::before,
  *::after {
    box-sizing: border-box;
  }

  html,
  body {
    height: 100%;
    margin: 0;
    background: #000000;
  }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font);
    color-scheme: dark;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  main {
    position: relative;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(26px, 4.4vh, 44px);
    padding: 48px 24px;
    text-align: center;
    animation: rise 1.1s cubic-bezier(0.22, 0.61, 0.36, 1) both;
  }

  .logo {
    display: block;
    height: clamp(130px, 21vh, 210px);
    width: auto;
    user-select: none;
    -webkit-user-drag: none;
  }

  .lockup {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(10px, 1.8vh, 16px);
  }

  h1 {
    margin: 0;
    font-family: var(--font);
    font-size: clamp(1rem, 2.3vw, 1.25rem);
    font-weight: 400;
    line-height: 1.2;
    letter-spacing: clamp(0.12em, 0.35vw, 0.18em);
    text-transform: uppercase;
    text-indent: clamp(0.12em, 0.35vw, 0.18em); /* balances tracking */
    color: var(--fg);
  }

  /* Playful terminal-style status line */
  .ascii {
    margin: 0;
    font-family: ui-monospace, "Cascadia Mono", "SF Mono", Consolas,
      "Courier New", monospace;
    font-size: clamp(10px, 1.05vw, 12px);
    line-height: 1.5;
    letter-spacing: 0.06em;
    color: rgba(255, 255, 255, 0.4);
    white-space: pre;
    user-select: none;
  }

  .ascii .spin {
    color: rgba(255, 255, 255, 0.55);
  }

  .ascii .caret {
    animation: blink 1.05s steps(1) infinite;
  }

  @keyframes blink {
    0%,
    49% {
      opacity: 1;
    }
    50%,
    100% {
      opacity: 0;
    }
  }

  @keyframes rise {
    from {
      opacity: 0;
      transform: translateY(14px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    main {
      animation: none;
    }
    .ascii .caret {
      animation: none;
    }
  }
</style>
</head>
<body>
  <main>
    <img class="logo" src="logo.png" alt="RareCut" width="784" height="822" />

    <div class="lockup">
      <h1>Coming Soon</h1>

      <p class="ascii" aria-hidden="true"><span class="spin">[|]</span> <span class="text">warming up the servers</span><span class="caret">_</span></p>
    </div>
  </main>

  <script>
    (function () {
      var spin = document.querySelector(".ascii .spin");
      var msgEl = document.querySelector(".ascii .text");
      var caret = document.querySelector(".ascii .caret");

      var messages = [
        "warming up the servers",
        "sharpening the details",
        "polishing every pixel",
        "almost there",
      ];
      var frames = ["[|]", "[/]", "[-]", "[\\]"];

      var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (reduce) {
        caret.style.display = "none";
        return;
      }

      var f = 0;
      setInterval(function () {
        f = (f + 1) % frames.length;
        spin.textContent = frames[f];
      }, 170);

      var i = 0;
      var chars = 0;
      var deleting = false;

      function tick() {
        var current = messages[i];

        if (!deleting) {
          chars++;
          msgEl.textContent = current.slice(0, chars);
          if (chars === current.length) {
            deleting = true;
            setTimeout(tick, 2100);
            return;
          }
          setTimeout(tick, 55);
        } else {
          chars--;
          msgEl.textContent = current.slice(0, chars);
          if (chars === 0) {
            deleting = false;
            i = (i + 1) % messages.length;
            setTimeout(tick, 380);
            return;
          }
          setTimeout(tick, 24);
        }
      }

      setTimeout(tick, 600);

      // A little something for anyone who opens the console
      console.log(
        "%c+---------------+\n| coming soon   |\n+---------------+",
        "color:#9aa0a6;font-family:monospace;line-height:1.4;"
      );
    })();
  </script>
</body>
</html>
